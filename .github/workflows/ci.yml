name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true

      - name: Check out code
        uses: actions/checkout@v7

      - name: Build
        run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true

      - name: Check out code
        uses: actions/checkout@v7

      - name: Tests
        run: go test -race ./...
